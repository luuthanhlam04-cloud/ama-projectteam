services:
  db:
    image: postgres:16-alpine
    container_name: ama_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432" # Máy Windows dùng 5433 để tránh bị chiếm cổng 5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ama-network

  qdrant:
    image: qdrant/qdrant:latest
    container_name: ama_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    #   networks:
    #     - ama-network

  redis:
    image: redis:7-alpine
    container_name: ama_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - ama-network

  backend:
    build: ./backend
    container_name: ama_backend
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db
      - qdrant
      - redis
    networks:
      - ama-network

  frontend:
    build: ./frontend
    container_name: ama_frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    stdin_open: true
    tty: true
    depends_on:
      - backend
      - redis
    networks:
      - ama-network

networks:
  ama-network:
    driver: bridge

volumes:
  postgres_data:
  qdrant_data:
  redis_data: